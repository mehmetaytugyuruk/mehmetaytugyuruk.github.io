<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RARE26 DualFix pipeline</title>
  <desc id="desc">Endoscopy images feed ResNet-50 and ViT-S/16 branches, which combine in a 54-checkpoint ensemble.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="21" refY="12" orient="auto">
      <path d="M3 3l18 9-18 9" fill="none" stroke="#5b6b70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="95" y="110" width="1410" height="680" fill="#eef7f6" stroke="#0e7a78" stroke-width="3"/>
  <text x="145" y="235" fill="#12201f" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700">RARE26</text>
  <text x="145" y="292" fill="#0e7a78" font-family="Georgia, 'Times New Roman', serif" font-size="40">DualFix training pipeline</text>
  <g fill="#ffffff" stroke="#0e7a78" stroke-width="4">
    <rect x="145" y="390" width="315" height="190"/>
    <rect x="625" y="355" width="380" height="125"/>
    <rect x="625" y="520" width="380" height="125"/>
    <rect x="1170" y="390" width="290" height="190"/>
  </g>
  <g fill="none" stroke="#5b6b70" stroke-width="5" marker-end="url(#arrow)">
    <path d="M462 485h120v-68h30"/>
    <path d="M462 485h120v98h30"/>
    <path d="M1008 417h102v68h45"/>
    <path d="M1008 583h102v-98h45"/>
  </g>
  <g fill="#12201f" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text x="302" y="465" font-size="52">Endoscopy</text>
    <text x="302" y="530" font-size="52">images</text>
    <text x="815" y="435" font-size="57">ResNet-50</text>
    <text x="815" y="600" font-size="57">ViT-S/16</text>
    <text x="1315" y="465" font-size="38">54 checkpoints</text>
    <text x="1315" y="530" font-size="52">ensemble</text>
  </g>
</svg>
