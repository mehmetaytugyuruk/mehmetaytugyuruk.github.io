<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page moved — {{ site.title }}</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
    <meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  </head>
  <body class="interior">
    <main id="main-content" class="page-main redirect-main">
      <h1 class="page-title">Page moved</h1>
      <p>This page now lives at <a class="text-link" href="{{ page.redirect_to | relative_url }}">{{ page.redirect_label }}</a>.</p>
    </main>
  </body>
</html>
