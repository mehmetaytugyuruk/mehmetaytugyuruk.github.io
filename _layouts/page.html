---
layout: default
---
<main id="main-content" class="page-main{% if page.wide %} page-main-wide{% endif %}">
  <header class="page-heading">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </header>
  {{ content }}
</main>
