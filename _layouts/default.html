<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% assign meta_title = page.title | default: site.title %}
    {% if page.home %}
      <title>{{ site.title }}</title>
    {% else %}
      <title>{{ meta_title }} — {{ site.title }}</title>
    {% endif %}
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="author" content="{{ site.data.profile.name }}">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">

    <meta property="og:title" content="{% if page.home %}{{ site.title }}{% else %}{{ meta_title }} — {{ site.title }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <meta property="og:image" content="{{ '/og-image.png' | absolute_url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ site.data.profile.name }} — {{ site.data.profile.role }}">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="{{ site.title }}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.home %}{{ site.title }}{% else %}{{ meta_title }} — {{ site.title }}{% endif %}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    <meta name="twitter:image" content="{{ '/og-image.png' | absolute_url }}">

    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ '/favicon-192.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <meta name="theme-color" content="#F7F6F2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": {{ '/#person' | absolute_url | jsonify }},
          "name": {{ site.data.profile.name | jsonify }},
          "url": {{ '/' | absolute_url | jsonify }},
          "image": {{ site.data.profile.portrait | absolute_url | jsonify }},
          "email": {{ site.data.profile.email | jsonify }},
          "jobTitle": {{ site.data.profile.role | jsonify }},
          "affiliation": {
            "@type": "CollegeOrUniversity",
            "name": {{ site.data.profile.institution | jsonify }}
          },
          "alumniOf": {
            "@type": "HighSchool",
            "name": {{ site.data.education.secondary_education.institution | jsonify }}
          },
          "description": {{ site.data.profile.role | append: '. Candidate for the ' | append: site.data.profile.degree | append: ' at ' | append: site.data.profile.institution | append: '.' | jsonify }},
          "knowsAbout": [
            {% for interest in site.data.profile.research_interests %}{{ interest | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}
          ],
          "sameAs": [
            {% assign external_profiles = site.data.profile.profiles | where: "external", true %}
            {% for profile in external_profiles %}{{ profile.url | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}
          ]
        },
        {
          "@type": "WebSite",
          "@id": {{ '/#website' | absolute_url | jsonify }},
          "name": {{ site.title | jsonify }},
          "url": {{ '/' | absolute_url | jsonify }},
          "author": { "@id": {{ '/#person' | absolute_url | jsonify }} },
          "inLanguage": {{ site.lang | jsonify }}
        }
      ]
    }
    </script>
  </head>
  <body class="{% if page.home %}home{% else %}interior{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
  </body>
</html>
