<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mehmet Aytuğ Yürük · Social preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; }
      body {
        display: flex;
        align-items: center;
        gap: 54px;
        padding: 0 86px;
        color: #363636;
        background: #fff;
        font-family: "Google Sans", "Noto Sans", Arial, sans-serif;
      }
      .portrait {
        width: 250px;
        height: 250px;
        flex: 0 0 auto;
        overflow: hidden;
        border: 1px solid #dedede;
        border-radius: 50%;
        background: #f5f5f5;
        object-fit: contain;
      }
      .profile { flex: 1; min-width: 0; }
      .name {
        margin: 0;
        font-size: 51px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1.12;
      }
      .role {
        margin: 20px 0 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.4;
      }
      .education {
        margin: 7px 0 0;
        color: #626262;
        font-size: 20px;
        line-height: 1.5;
      }
      .rule {
        height: 1px;
        margin: 28px 0 22px;
        background: #dedede;
      }
      .focus {
        margin: 0;
        color: #626262;
        font-size: 19px;
        line-height: 1.7;
      }
      .url {
        position: absolute;
        bottom: 43px;
        left: 86px;
        margin: 0;
        color: #0878bd;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <img class="portrait" src="../assets/images/site/photo.png" alt="">
    <main class="profile">
      <h1 class="name">Mehmet Aytuğ Yürük</h1>
      <p class="role">Computer Vision &amp; Medical Imaging</p>
      <p class="education">B.Sc. in Artificial Intelligence &amp; Data Engineering<br>Istanbul University</p>
      <div class="rule"></div>
      <p class="focus">Applied AI · Deep Learning · Research Engineering</p>
    </main>
    <p class="url">mehmetaytugyuruk.github.io</p>
  </body>
</html>
