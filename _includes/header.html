<header class="site-header">
  <div class="site-header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.data.profile.short_name }}</a>

    <nav class="desktop-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.nav_key == item.key %} aria-current="page"{% endif %}{% if item.external %} target="_blank" rel="noopener noreferrer"{% endif %}>
          {{ item.label }}{% if item.pdf %}<span class="nav-meta">PDF</span>{% endif %}
        </a>
      {% endfor %}
    </nav>

    <details class="mobile-nav">
      <summary>Menu</summary>
      <nav aria-label="Mobile navigation">
        {% for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}"{% if page.nav_key == item.key %} aria-current="page"{% endif %}{% if item.external %} target="_blank" rel="noopener noreferrer"{% endif %}>
            {{ item.label }}{% if item.pdf %} · PDF{% endif %}
          </a>
        {% endfor %}
      </nav>
    </details>
  </div>
</header>
