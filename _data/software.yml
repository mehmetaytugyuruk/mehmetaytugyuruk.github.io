- id: biyoves
  display_order: 3
  name: biyoves
  image: /assets/images/projects/biyoves.png
  image_alt: BiyoVes workflow showing portrait detection and alignment followed by a four-photo print layout.
  version: "1.4.1"
  release_label: PyPI v1.4.1
  programming_language: Python
  category: Applied Computer Vision
  description: A Python library and Web Studio for standards-based biometric, passport, and visa photo preparation, combining face alignment, portrait matting, format-specific crop geometry, automated quality preflight, and print-ready photo layouts.
  detail_description: biyoves is a Python library and browser-based Web Studio for standards-based biometric, passport, and visa photo preparation. It combines SCRFD-based face detection and alignment with portrait matting, format-specific crop geometry, and automated quality preflight. The workflow supports standard photo formats and print templates, including 300-DPI PDF output, while preflight warnings remain advisory rather than a guarantee of issuing-authority acceptance. The library and Web Studio provide two access paths to the same preparation workflow.
  links:
    - label: GitHub
      url: https://github.com/mehmetaytugyuruk/biyoves
    - label: PyPI
      url: https://pypi.org/project/biyoves/
  website: https://mehmetaytugyuruk.github.io/biyoves/
