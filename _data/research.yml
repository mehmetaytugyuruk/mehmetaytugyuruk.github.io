title: Retinal Fundus Age Estimation
question: How do model architecture, retinal-image preprocessing, and input representation affect chronological-age estimation from fundus images under a consistent patient-level evaluation setting?
homepage_summary: >-
  Three sequential studies examine retinal age estimation under patient-level evaluation: ResNet baselines with preprocessing comparisons, Vision Transformer variants, and controlled colour-representation and ensemble experiments. Public research artifacts across the three studies include code, model checkpoints, split definitions, and study-specific predictions or analysis outputs where available.
overview: This research line begins with five ResNet variants and preprocessing comparisons, including Graham filtering, then examines four Vision Transformer variants in the same patient-level evaluation context. The third study uses a controlled ResNet-50 setting to investigate colour-space diversity, early fusion, and matched ensemble designs. Together, the studies trace how architecture, preprocessing, and input representation shape the retinal age-estimation task.
studies:
  - publication_id: retinal-resnet
    number: "01"
    short_label: CNN baselines
    heading: Residual Neural Networks
    stage: Task + CNN baseline investigation
    summary: Study 01 asks how residual-network architecture and retinal preprocessing affect chronological-age prediction and age categorisation. Five ResNet variants are evaluated with preprocessing settings that include Graham filtering, using patient-level partitions to keep images from the same person within one split. The study establishes the convolutional baseline and reports results for each defined configuration. Public artifacts include source code, patient-level split definitions in the project repository, and model checkpoints for the reported experiments. These materials document the evaluation setup and trained models.
  - publication_id: retinal-vit
    number: "02"
    short_label: Vision Transformers
    heading: Vision Transformers
    stage: Alternative backbone investigation
    summary: Study 02 asks how Vision Transformer backbones perform on the same retinal age-estimation task and patient-level evaluation context. Four Transformer variants extend the investigation beyond convolutional architectures. The change in backbone family isolates a new architectural question while preserving the established task framing. Comparisons with the earlier ResNet results use the published companion study as the reference. Public artifacts include source code, experiment configurations, and model checkpoints for the Transformer variants, supporting direct inspection of the implemented training and evaluation setup.
  - publication_id: retinal-colour
    number: "03"
    short_label: Colour representations
    heading: Alternative Colour Representations
    stage: Controlled representation study
    summary: Study 03 asks how input representation and ensemble construction affect retinal age estimation in a controlled ResNet-50 setting. It evaluates colour-space diversity, early fusion, and an equal-cost colour ensemble against a matched RGB-seed ensemble, separating representation diversity from additional training cost. The early-fusion experiment tests a distinct multi-channel input construction, while the matched ensemble comparison keeps the training budget aligned. Public artifacts include source code, model weights, tracked predictions, experiment configurations, and analysis outputs for the reported comparisons. These materials expose the analysis pathway used for the controlled comparisons. The manuscript remains under review.
artifacts_note: Public research artifacts are provided where available. Depending on the study, these include source code, patient-level split definitions, model checkpoints, tracked predictions, configurations, and analysis outputs.
